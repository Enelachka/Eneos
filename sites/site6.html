<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>РЎР°Р№С‚ 1</title>
  <link rel="icon" type="image/svg+xml" href="../avatar.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0a18;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #a855f7;
      --accent2: #667eea;
    }
    /* С‚РµРјС‹ РјРµРЅСЏСЋС‚ С‚РѕР»СЊРєРѕ Р°РєС†РµРЅС‚С‹, С„РѕРЅ РІСЃРµРіРґР° РѕРґРёРЅ */
    body[data-theme="blue"] { --accent: #3b82f6; --accent2: #22d3ee; }
    body[data-theme="green"] { --accent: #22c55e; --accent2: #a3e635; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-blobs, .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-grid {
      background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.5; animation: drift 14s ease-in-out infinite alternate; }
    .blob.b1 { width: 480px; height: 480px; left: -140px; top: -140px; background: #6d28d9; }
    .blob.b2 { width: 420px; height: 420px; right: -120px; top: 20%; background: #2563eb; animation-delay: -5s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(70px, 50px) scale(1.15); }
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0;
      background: rgba(13, 10, 24, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-weight: 800; font-size: 1.2rem; }
    .logo img { width: 32px; height: 32px; }
    #themeBtn {
      margin-left: auto;
      padding: 9px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 10px;
      transition: transform 0.2s, filter 0.2s;
    }
    #themeBtn:hover { transform: scale(1.05); filter: brightness(1.15); }
    main { max-width: 920px; margin: 0 auto; padding: 64px 16px 60px; text-align: center; position: relative; z-index: 1; }
    main h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      background: linear-gradient(90deg, #fff, var(--accent), #fff);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 250% center; } }
    main p { color: #bbb; margin-top: 16px; line-height: 1.7; }
    footer { text-align: center; padding: 26px 16px 40px; border-top: 1px solid var(--border-color); color: #888; position: relative; z-index: 1; }
    footer a { color: #bbb; }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-blobs"><div class="blob b1"></div><div class="blob b2"></div></div>

<header>
  <a href="../index.html" class="logo"><img src="../avatar.svg" alt="logo"><!-- EDIT -->РЎР°Р№С‚ 1</a>
  <button id="themeBtn">рџЋЁ РўРµРјР°</button>
</header>

<main>
  <!-- EDIT: Р·Р°РіРѕР»РѕРІРѕРє Рё С‚РµРєСЃС‚ -->
  <h1>РЎР°Р№С‚ 1</h1>
  <p>РћРїРёСЃР°РЅРёРµ. РљРёРЅРµС€СЊ СЃРІРѕР№ С‚РµРєСЃС‚ вЂ” РІСЃС‚Р°РІР»СЋ.</p>
</main>

<footer>
  <!-- EDIT -->
  <p>В© 2026 РЎР°Р№С‚ 1 В· <a href="../index.html">РќР° РіР»Р°РІРЅСѓСЋ</a></p>
</footer>

<script>
  // С‚РµРјС‹: С„РёРѕР»РµС‚ в†’ СЃРёРЅРёР№ в†’ Р·РµР»РµРЅС‹Р№, С„РѕРЅ РЅРµ РјРµРЅСЏРµС‚СЃСЏ
  const themes = ['', 'blue', 'green'];
  let ti = 0;
  try { ti = Math.max(0, themes.indexOf(localStorage.getItem('site6-theme') || '')); } catch (e) {}
  if (ti > 0) document.body.dataset.theme = themes[ti];
  document.getElementById('themeBtn').addEventListener('click', () => {
    ti = (ti + 1) % themes.length;
    if (ti === 0) delete document.body.dataset.theme;
    else document.body.dataset.theme = themes[ti];
    try { localStorage.setItem('site6-theme', themes[ti]); } catch (e) {}
  });
</script>
</body>
</html>
