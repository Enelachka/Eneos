<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Сайт 3</title>
  <link rel="icon" type="image/svg+xml" href="../avatar.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d0a18;
      --card-bg: rgba(255, 255, 255, 0.05);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent: #a855f7;
      --accent2: #667eea;
    }
    /* темы меняют только акценты, фон всегда один */
    body[data-theme="blue"] { --accent: #3b82f6; --accent2: #22d3ee; }
    body[data-theme="green"] { --accent: #22c55e; --accent2: #a3e635; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-blobs, .bg-grid { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
    .bg-grid {
      background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, #000 30%, transparent 75%);
    }
    .blob { position: absolute; border-radius: 50%; filter: blur(110px); opacity: 0.5; animation: drift 14s ease-in-out infinite alternate; }
    .blob.b1 { width: 480px; height: 480px; left: -140px; top: -140px; background: #6d28d9; }
    .blob.b2 { width: 420px; height: 420px; right: -120px; top: 20%; background: #2563eb; animation-delay: -5s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(70px, 50px) scale(1.15); }
    }
    header {
      display: flex; align-items: center; gap: 16px;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 0;
      background: rgba(13, 10, 24, 0.85);
      backdrop-filter: blur(12px);
      z-index: 50;
    }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #fff; font-weight: 800; font-size: 1.2rem; }
    .logo img { width: 32px; height: 32px; }
    #themeBtn {
      margin-left: auto;
      padding: 9px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      border: none;
      border-radius: 10px;
      transition: transform 0.2s, filter 0.2s;
    }
    #themeBtn:hover { transform: scale(1.05); filter: brightness(1.15); }
    main { max-width: 920px; margin: 0 auto; padding: 64px 16px 60px; text-align: center; position: relative; z-index: 1; }
    main h1 {
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      background: linear-gradient(90deg, #fff, var(--accent), #fff);
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine { to { background-position: 250% center; } }
    main p { color: #bbb; margin-top: 16px; line-height: 1.7; }
    /* ===== Анимации появления ===== */
    header { animation: fadeDown 0.7s ease both; }
    main { animation: fadeUp 0.8s ease 0.15s both; perspective: 800px; }
    footer { animation: fadeUp 0.8s ease 0.3s both; }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(26px); }
      to { opacity: 1; transform: none; }
    }
    main h1 { transform-style: preserve-3d; will-change: transform; }
    #themeBtn { animation: btnGlow 2.6s ease-in-out infinite; }
    @keyframes btnGlow {
      0%, 100% { box-shadow: 0 0 10px rgba(168,85,247,0.35); }
      50% { box-shadow: 0 0 26px rgba(168,85,247,0.75); }
    }
    footer { text-align: center; padding: 26px 16px 40px; border-top: 1px solid var(--border-color); color: #888; position: relative; z-index: 1; }
    footer a { color: #bbb; }
  </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="bg-blobs"><div class="blob b1"></div><div class="blob b2"></div></div>

<header>
  <a href="../Home/" class="logo"><img src="../avatar.svg" alt="logo"><!-- EDIT -->Сайт Enelamine</a>
  <button id="themeBtn">🎨 Тема</button>
</header>

<main>
  <!-- EDIT: заголовок и текст -->
  <h1>Сайт 3</h1>
  <p>Описание. Кинешь свой текст — вставлю.</p>
</main>

<footer>
  <!-- EDIT -->
  <p>© 2026 Сайт 3 · <a href="../index.html">На главную</a></p>
</footer>

<script>
  // темы: фиолет → синий → зеленый, фон не меняется
  const themes = ['', 'blue', 'green'];
  let ti = 0;
  try { ti = Math.max(0, themes.indexOf(localStorage.getItem('site3-theme') || '')); } catch (e) {}
  if (ti > 0) document.body.dataset.theme = themes[ti];
  document.getElementById('themeBtn').addEventListener('click', () => {
    ti = (ti + 1) % themes.length;
    if (ti === 0) delete document.body.dataset.theme;
    else document.body.dataset.theme = themes[ti];
    try { localStorage.setItem('site3-theme', themes[ti]); } catch (e) {}
  });
  // 3D-наклон заголовка за курсором
  (function () {
    var h1 = document.querySelector('main h1');
    document.addEventListener('mousemove', function (e) {
      var x = e.clientX / window.innerWidth - 0.5;
      var y = e.clientY / window.innerHeight - 0.5;
      h1.style.transform = 'rotateY(' + (x * 12) + 'deg) rotateX(' + (-y * 12) + 'deg)';
    });
  })();
</script>
</body>
</html>
