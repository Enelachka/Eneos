<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Скачать Eneos</title>
  <link rel="icon" type="image/svg+xml" href="avatar.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0d0a18;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
      gap: 18px;
    }
    .logo-big { width: 110px; height: 110px; filter: drop-shadow(0 0 24px rgba(168,85,247,0.7)); animation: float 3s ease-in-out infinite; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); }
    .ver { color: #bbb; }
    .req {
      max-width: 560px;
      width: 100%;
      text-align: left;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      padding: 20px 24px;
      line-height: 1.8;
      color: #ccc;
    }
    .dl-btn {
      display: inline-block;
      padding: 18px 54px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #667eea, #a855f7);
      box-shadow: 0 10px 34px rgba(168,85,247,0.55);
      transition: transform 0.2s;
    }
    .dl-btn:hover { transform: scale(1.05); }
    .size { color: #888; font-size: 0.95rem; }
    .back { color: #bbb; margin-top: 10px; }
  </style>
</head>
<body>
  <img class="logo-big" src="avatar.svg" alt="Eneos">
  <!-- EDIT: название и версия -->
  <h1>Eneos — сборка Windows</h1>
  <p class="ver">Версия: демо · Размер: ~5 ГБ</p>

  <a class="dl-btn" href="#"><!-- EDIT: вставлю ссылку -->Скачать ISO</a>
  <p class="size">Eneos.iso · проверь хеш после скачивания</p>

  <div class="req">
    <!-- EDIT: требования и инструкция -->
    <b>Что нужно:</b> флешка 8+ ГБ, Rufus или Ventoy.<br>
    <b>Как ставить:</b> запиши ISO на флешку, загрузись с нее, следуй установщику.
  </div>

  <a class="back" href="Home/">← На главную</a>
</body>
</html>
