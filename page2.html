<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница 2</title>
  <link rel="stylesheet" href="player.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
      background-size: 300% 300%;
      animation: bgMove 12s ease infinite;
      padding: 40px 20px 120px;
      color: #fff;
      perspective: 800px;
    }
    @keyframes bgMove {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    h1 {
      font-size: 2rem;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
      transform-style: preserve-3d;
      will-change: transform;
    }
    /* плеер внизу (из player.css), с легким 3D-наклоном */
    #player { transform-style: preserve-3d; will-change: transform; }
  </style>
</head>
<body>
  <h1 id="tilt">Пустая страница 2</h1>

  <!-- Плеер внизу -->
  <div id="player">
    <div class="pl-cover">🎵</div>
    <div class="eq"><span></span><span></span><span></span><span></span><span></span></div>
    <div class="pl-main">
      <div id="plTitle">Загрузка...</div>
      <div class="pl-row">
        <button id="plPrev" title="Назад">⏮</button>
        <button id="plPlay" title="Пауза/играть">▶</button>
        <button id="plNext" title="Вперед">⏭</button>
        <span id="plCur">0:00</span>
        <input id="plSeek" type="range" min="0" max="1000" value="0" title="Перемотка">
        <span id="plDur">0:00</span>
        <input id="plVol" type="range" min="0" max="100" value="30" title="Громкость">
      </div>
    </div>
  </div>
  <script src="music/playlist.js"></script>
  <script src="player.js"></script>

  <script>
    // 3D-наклон заголовка и плеера за курсором
    function tilt(el, max) {
      document.addEventListener('mousemove', (e) => {
        const x = e.clientX / window.innerWidth - 0.5;
        const y = e.clientY / window.innerHeight - 0.5;
        el.style.transform = `rotateY(${x * max}deg) rotateX(${-y * max}deg)`;
      });
    }
    tilt(document.getElementById('tilt'), 14);
    tilt(document.getElementById('player'), 5);
  </script>
</body>
</html>
